name: Mudra 24/7 Hourly Quant Worker

on:
  schedule:
    - cron: '15 * * * *'  # Runs at :15 every hour (after Binance closes the 1h candle at :00)
  workflow_dispatch:     # On-demand manual execution & external webhook trigger

concurrency:
  group: hourly-quant-worker
  cancel-in-progress: false

jobs:
  run-worker:
    name: Ingest Candle, Reconcile T-1 & Execute Paper Trade
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python 3.11 Runtime
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Mudra Hourly Worker
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LANGSMITH_TRACING: ${{ secrets.LANGSMITH_TRACING }}
          LANGCHAIN_TRACING_V2: ${{ secrets.LANGSMITH_TRACING }}
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
          LANGSMITH_PROJECT: ${{ secrets.LANGSMITH_PROJECT }}
          PYTHONPATH: .
        run: |
          python scripts/run_hourly_worker.py --require-postgres
