name: Mudra 24/7 Hourly Quant Worker

on:
  schedule:
    - cron: '15 * * * *'  # Runs at :15 every hour (after Binance closes the 1h candle at :00)
  workflow_dispatch:     # On-demand manual execution & external webhook trigger

concurrency:
  group: hourly-quant-worker
  cancel-in-progress: false

jobs:
  run-worker:
    name: Ingest Candle, Reconcile T-1 & Execute Paper Trade
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python 3.11 Runtime
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Mudra Hourly Worker
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PYTHONPATH: .
        run: |
          python scripts/run_hourly_worker.py

      - name: Keep Streamlit Dashboard Awake
        if: always()
        run: |
          STREAMLIT_URL="${{ secrets.STREAMLIT_APP_URL }}"
          TARGET_URL="${STREAMLIT_URL:-https://mudra-trading.streamlit.app}"
          echo "Pinging Streamlit Dashboard at $TARGET_URL to prevent hibernation..."
          STATUS=$(curl -s -L -m 25 -o /dev/null -w "%{http_code}" "$TARGET_URL" || echo "FAILED")
          echo "Dashboard ping completed with HTTP status: $STATUS"
          echo "Pinging healthz endpoint..."
          HEALTH_STATUS=$(curl -s -L -m 15 -o /dev/null -w "%{http_code}" "$TARGET_URL/healthz" || echo "FAILED")
          echo "Healthz ping completed with HTTP status: $HEALTH_STATUS"
