name: Mudra 24/7 Hourly Quant Worker

on:
  schedule:
    # Runs at the top of every hour (24 times a day, 365 days a year)
    - cron: '0 * * * *'
  workflow_dispatch:  # Enables manual 1-click execution in GitHub Actions UI

concurrency:
  group: hourly-quant-worker
  cancel-in-progress: false

jobs:
  run-worker:
    name: Ingest Candle, Reconcile T-1 & Execute Paper Trade
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python 3.11 Runtime
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Mudra Hourly Worker
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PYTHONPATH: .
        run: |
          python scripts/run_hourly_worker.py