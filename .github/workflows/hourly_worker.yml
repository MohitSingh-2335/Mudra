name: Mudra 24/7 Hourly Quant Worker

on:
  schedule:
    - cron: '15 * * * *'  # Runs at :15 every hour (after Binance closes the 1h candle at :00)
  workflow_dispatch:     # On-demand manual execution & external webhook trigger

concurrency:
  group: hourly-quant-worker
  cancel-in-progress: false

jobs:
  run-worker:
    name: Ingest Candle, Reconcile T-1 & Execute Paper Trade
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python 3.11 Runtime
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Mudra Hourly Worker
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PYTHONPATH: .
        run: |
          python scripts/run_hourly_worker.py

      - name: Keep Streamlit Dashboard Awake
        if: always()
        run: |
          STREAMLIT_URL="${{ secrets.STREAMLIT_APP_URL }}"
          if [ -n "$STREAMLIT_URL" ]; then
            echo "Pinging Streamlit App to prevent hibernation..."
            curl -s -m 15 -o /dev/null -w "HTTP status: %{http_code}\n" "$STREAMLIT_URL" || true
          else
            echo "STREAMLIT_APP_URL secret not set. Skipping ping."
          fi