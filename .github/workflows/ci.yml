# .github/workflows/ci.yml - Mudra Automated CI/CD Pipeline

name: Mudra CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # Job 1: Automated Unit & Integration Testing
  test:
    name: Run Pytest Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11 Runtime
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Production & Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare Test Datasets
        run: |
          mkdir -p data/raw data/processed
          test -f tests/fixtures/BTCUSDT-1H.csv || { echo "Missing fixture tests/fixtures/BTCUSDT-1H.csv"; exit 1; }
          cp tests/fixtures/BTCUSDT-1H.csv data/raw/BTCUSDT-1H.csv

      - name: Execute Automated Test Suite
        env:
          PYTHONPATH: .
        run: |
          python -m pytest tests/ -v

  # Job 2: Container Image Build Verification
  build-containers:
    name: Validate Docker Image
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Streamlit Container Build (Port 8501)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: mudra-terminal:latest
