# .github/workflows/ci.yml - Mudra Automated CI/CD Pipeline

name: Mudra CI/CD Pipeline

on:
  push:
    branches: [ main, master, code-cleanup ]
  pull_request:
    branches: [ main, master, code-cleanup ]

jobs:
  # Job 1: Automated Unit & Integration Testing
  test:
    name: Run Pytest Suite with Isolated PostgreSQL
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mudra_test_user
          POSTGRES_PASSWORD: mudra_test_password
          POSTGRES_DB: mudra_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mudra_test_user -d mudra_test_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11 Runtime
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Production & Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare Test Datasets
        run: |
          mkdir -p data/raw data/processed
          test -f tests/fixtures/BTCUSDT-1H.csv || { echo "Missing fixture tests/fixtures/BTCUSDT-1H.csv"; exit 1; }
          test -f tests/fixtures/featured_btc_data_candidate.csv || { echo "Missing fixture tests/fixtures/featured_btc_data_candidate.csv"; exit 1; }
          cp tests/fixtures/BTCUSDT-1H.csv data/raw/BTCUSDT-1H.csv
          cp tests/fixtures/featured_btc_data_candidate.csv data/processed/featured_btc_data_candidate.csv

      - name: Execute Automated Test Suite
        env:
          PYTHONPATH: .
          TEST_DATABASE_URL: postgresql+psycopg2://mudra_test_user:mudra_test_password@localhost:5432/mudra_test_db
        run: |
          python -m pytest tests/ -v

  # Job 2: Container Image Build Verification
  build-containers:
    name: Validate Docker Images
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate FastAPI Container Build (Port 8000)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: mudra-api:latest

      - name: Validate Streamlit Container Build (Port 8501)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.streamlit
          push: false
          tags: mudra-ui:latest
