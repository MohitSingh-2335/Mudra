name: Keep Streamlit App Awake

on:
  schedule:
    - cron: '0 */8 * * *'
  workflow_dispatch:

concurrency:
  group: keep-streamlit-awake
  cancel-in-progress: true

jobs:
  wake-up:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Wake Mudra Streamlit Dashboard
        uses: gpenessot/streamlit-keep-alive@v1
        with:
          app-urls: https://mudra-trading.streamlit.app
