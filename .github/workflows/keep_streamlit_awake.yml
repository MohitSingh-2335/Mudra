name: Keep Streamlit App Awake

on:
  schedule:
    - cron: '0 */8 * * *'
  workflow_dispatch:

concurrency:
  group: keep-streamlit-awake
  cancel-in-progress: true

jobs:
  wake-up:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Ping Mudra Streamlit Dashboard
        run: |
          echo "Pinging Mudra Streamlit Dashboard..."
          curl -s -L --max-time 30 -o /dev/null -w "HTTP status: %{http_code}\n" https://mudra-trading.streamlit.app || true

      - name: Wake Mudra Streamlit Dashboard (Browser Fallback)
        uses: gpenessot/streamlit-keep-alive@main
        with:
          app-urls: https://mudra-trading.streamlit.app
