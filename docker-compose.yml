# docker-compose.yml - Mudra Interactive Quantitative Terminal

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mudra-terminal
    ports:
      - "8501:8501"
    environment:
      - DATABASE_URL=${DATABASE_URL:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
